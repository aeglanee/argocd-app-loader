---
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1

      # v1.2.1, the flake's kubernetes-helmPlugins.helm-unittest, pinned to the tag's commit like the
      # actions above. Helm 4 refuses a git source without --verify=false: "plugin source does not
      # support verification".
      - name: helm-unittest
        run: >-
          helm plugin install https://github.com/helm-unittest/helm-unittest
          --version 67056cc631eab9e001e6762a1f601e6c92a71ba7 --verify=false

      - name: pre-commit
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure

      - name: lint, unit tests, golden renders
        run: task check
