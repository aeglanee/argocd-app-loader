---
name: Release Helm chart

# A version tag (v0.9.0) on a commit of main publishes that commit's chart to
# oci://ghcr.io/<owner>/charts. The tag reruns CI, then the push waits for a reviewer's approval in
# the `release` environment. A version ghcr already has is refused: OCI tags can be overwritten, a
# published version must not be. A tag ruleset keeps v* tags from being moved or deleted.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  HELM_VERSION: v4.3.1

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Beside CI, before the approval, so a wrong tag fails early and without anyone being asked.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: The tag matches Chart.yaml's version
        run: |
          set -euo pipefail
          chart=$(helm show chart . | awk '/^version:/ {print $2}')
          test "${GITHUB_REF_NAME}" = "v${chart}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} but Chart.yaml says ${chart}"; exit 1; }

      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} tags a commit that isn't on main"; exit 1; }

  publish:
    needs:
      - ci
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Here, right before the push, so a rerun of this job alone can't overwrite a release either.
      # Only Helm's "not found" means absent; any other error fails rather than risk an overwrite.
      - name: ghcr doesn't have this version yet
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          if out=$(helm show chart "oci://ghcr.io/${OWNER}/charts/argocd-app-loader" --version "${version}" 2>&1); then
            echo "::error::ghcr already has argocd-app-loader ${version}; bump the version"
            exit 1
          fi
          case "${out}" in
            *": not found"*) ;;
            *) echo "::error::can't tell whether ghcr has ${version}: ${out}"; exit 1 ;;
          esac

      - name: Package
        run: helm package . --destination dist

      - name: Push to ghcr
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io -u "${ACTOR}" --password-stdin <<< "${TOKEN}"
          helm push dist/*.tgz "oci://ghcr.io/${OWNER}/charts"
