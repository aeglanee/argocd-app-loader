---
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    timeout-minutes: 20
    runs-on: ${{ github.event.repository.private && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint, unit tests, golden renders, schema check
        run: make lint check

  release-please:
    needs: check
    timeout-minutes: 10
    runs-on: ${{ github.event.repository.private && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    permissions: {}
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    timeout-minutes: 10
    runs-on: ${{ github.event.repository.private && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Push the chart to ghcr, unless it has this version already
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm=$(sed -n 's/^HELM := //p' tools.mk)
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp --workdir /src --volume "${PWD}:/src:ro" \
            --env TOKEN --env ACTOR --env OWNER --env "VERSION=${TAG#v}" --entrypoint sh "${helm}" -euc '
              printf "%s" "${TOKEN}" | helm registry login ghcr.io --username "${ACTOR}" --password-stdin
              chart="oci://ghcr.io/${OWNER}/charts/argocd-app-loader"
              if out=$(helm show chart "${chart}" --version "${VERSION}" 2>&1); then
                echo "::error::ghcr already has argocd-app-loader ${VERSION}"
                exit 1
              fi
              case "${out}" in
                *": not found"*) ;;
                *) echo "::error::cannot tell whether ghcr has ${VERSION}: ${out}"; exit 1 ;;
              esac
              helm package . --destination /tmp/dist
              helm push "/tmp/dist/argocd-app-loader-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"'
