---
# Golden renders: every fixture is rendered against THIS checkout of the loader and committed under
# test/golden/. A change to the loader shows up as a diff of the real output; review it, then commit.
version: "3"

vars:
  # JSON Schemas for the Argo CD kinds in the goldens, from datreeio/CRDs-catalog, pinned to a
  # commit so a catalog change can't break or loosen the check unnoticed. Bump it on purpose.
  CRDS_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/3eb90d47aba8d61919d4419dd38301536e32a94b

tasks:
  golden:
    desc: Render the fixtures into test/golden/
    cmds:
      - for:
          - examples/consumer
          - examples/catalogue
          - test/fixtures/gitops
        cmd: rm -rf {{.ITEM}}/charts {{.ITEM}}/Chart.lock && helm dependency build {{.ITEM}} >/dev/null
      - helm template cluster examples/consumer --namespace argocd > test/golden/example.yaml
      - helm template cluster examples/catalogue --namespace argocd > test/golden/catalogue.yaml
      - >-
        rm -rf examples/catalogue/packages/core/charts examples/catalogue/packages/core/Chart.lock
        && helm dependency build examples/catalogue/packages/core >/dev/null
      # The core package as its Application renders it: the catalogue's values, then where it lives.
      - >-
        helm template core examples/catalogue/packages/core --namespace argocd -f examples/catalogue/values.yaml
        --set argocdAppLoader.source.repoURL=https://github.com/example/catalogue.git
        --set argocdAppLoader.source.path=packages/core > test/golden/catalogue-core.yaml
      - >-
        helm template cluster test/fixtures/gitops --namespace argocd
        -f test/fixtures/gitops/cluster-values.yaml > test/golden/gitops.yaml
      - >-
        helm template cluster test/fixtures/gitops --namespace argocd
        -f test/fixtures/gitops/cluster-values.yaml -f test/fixtures/gitops/second-cluster-values.yaml
        > test/golden/gitops-second.yaml

  unit:
    desc: Run the helm-unittest suites in test/unit/
    cmds:
      - rm -rf test/unit/charts test/unit/Chart.lock && helm dependency build test/unit >/dev/null
      - helm unittest test/unit

  validate:
    desc: Check the golden renders against the Application and AppProject schemas
    cmds:
      # The cache (git-ignored) saves refetching the pinned schemas, and lets the check run offline.
      - mkdir -p .helm-tests/kubeconform
      - >-
        kubeconform -strict -summary -cache .helm-tests/kubeconform
        -schema-location '{{.CRDS_CATALOG}}/{{"{{"}}.Group{{"}}"}}/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json'
        test/golden/*.yaml

  check:
    desc: Lint the chart, run the unit tests, fail if a render differs from its golden file, validate the goldens
    cmds:
      - helm lint .
      - task: unit
      - task: golden
      - git diff --exit-code -- test/golden
      - task: validate
