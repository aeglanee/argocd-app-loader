# The catalogue: which packages exist, their order, where they live, and the defaults every
# package (and the root) reads.
argocdAppLoader:
  packages:
    core:
      wave: 0                     # packages/core in this repo
    media:
      wave: 20                    # a package from another repo
      repoURL: https://github.com/example/media-package.git
  # Dependencies, checked in each package's render (opt-in). Switching hello off while needs-hello
  # is on fails core's render, so nothing is pruned.
  dependencies:
    hello:
      package: core
      provides:
        - greeting
    needs-hello:
      package: core
      requires:
        - greeting

cluster:
  domain: example.com             # a default; a cluster's file sets its own
