cluster:
  domain: example.com
  clusterServer: https://kubernetes.default.svc
  argocdNamespace: argocd

  # Chart/git MIRRORS. Apps always declare their real upstream (chart.repo); this block
  # decides whether a source is pulled through a local mirror instead. Private only when
  # the method is enabled AND a table key matches AND the app has not set mirror: false.
  mirrors:
    via:
      harbor:  # OCI proxy-cache
        enabled: false
        host: "harbor.{{ .Values.cluster.domain }}"
      shim:  # HTTP repo → OCI (host defaults to harbor's)
        enabled: false
        project: shim-proxy
      forgejo:
        enabled: false
        base: "http://gitea.{{ .Values.cluster.domain }}/example"
    table:  # scheme-less upstream prefix, longest match wins (whole path segments)
      ghcr.io:
        via: harbor
        project: ghcr-proxy
      stefanprodan.github.io/podinfo:
        via: shim
      github.com/rustfs/operator:
        via: forgejo
        repo: rustfs-operator

  # App on/off toggles. Values files can read them too (e.g. to branch on a peer app).
  apps:
    hello: true
    gitchart: true
    httpchart: true
    wraponly: true
    wrapped: true
    patched: true

# Where this chart's own files live. The loader points each app's local chart here; Helm can't
# tell on its own where a chart sits in its repo.
argocdAppLoader:
  source:
    repoURL: "git@github.com:example/cluster.git"
    targetRevision: HEAD
    path: examples/consumer
