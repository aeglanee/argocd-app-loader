cluster:
  domain: example.com
  clusterServer: https://kubernetes.default.svc
  argocdNamespace: argocd

  mirrors:
    via:
      harbor:
        enabled: false
        host: "harbor.{{ .Values.cluster.domain }}"
      shim:
        enabled: false
        project: shim-proxy
      forgejo:
        enabled: false
        base: "http://gitea.{{ .Values.cluster.domain }}/example"
    table:
      ghcr.io:
        via: harbor
        project: ghcr-proxy
      stefanprodan.github.io/podinfo:
        via: shim
      github.com/rustfs/operator:
        via: forgejo
        repo: rustfs-operator

  apps:
    hello: true
    gitchart: true
    httpchart: true
    wraponly: true
    wrapped: true
    patched: true

argocdAppLoader:
  source:
    repoURL: "git@github.com:example/cluster.git"
    targetRevision: HEAD
    path: examples/consumer
  dependencies:
    patched:
      requires:
        - hello
    hello: {}
