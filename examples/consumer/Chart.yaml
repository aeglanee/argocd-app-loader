apiVersion: v2
name: cluster
description: Minimal end-to-end example of consuming the argocd-app-loader library.
type: application
version: 0.0.1

# This example is checked into the same repo as the library itself, so it
# resolves the dependency via a relative file:// path. Real consumers should
# pull a published version from the OCI repository instead:
#
#   repository: "oci://ghcr.io/<owner>/charts"
#
# See README.md "Quick start" for the published-consumer setup.
dependencies:
  - name: argocd-app-loader
    version: ">=0.1.0"
    repository: "file://../../"
