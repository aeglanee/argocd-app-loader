apiVersion: v2
name: cluster
description: |
  Cluster-level app-of-apps. Walks apps/<group>/<name>/ wrapper charts and
  emits one Argo CD Application per app + one AppProject per group, via the
  argocd-app-loader library chart.
type: application
version: 0.2.0

dependencies:
  - name: argocd-app-loader
    version: ">=0.1.0"
    repository: "file://../../.."  # fixture: the local loader, not the published chart
