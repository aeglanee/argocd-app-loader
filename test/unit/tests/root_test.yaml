suite: root
templates:
  - root.yaml
release:
  name: cluster
set:
  rootTest: true
  cluster:
    remoteGitRepo: https://git.example.com/catalogue.git
    localGitRepo: http://forgejo.local/catalogue
    instanceRemoteRepo: https://git.example.com/fleet.git
    instanceLocalRepo: http://forgejo.local/fleet
    instanceValuesFiles:
      - clusters/common.yaml
      - clusters/this.yaml
    packages:
      a: true
      b: true
  argocdAppLoader:
    rootPath: root
    packages:
      a:
        wave: 0
      b:
        wave: 10
tests:
  - it: emits itself from the instance repo, reading the catalogue's values and then the cluster's
    documentSelector:
      path: metadata.name
      value: cluster
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false
      - equal:
          path: spec.sources
          value:
            - repoURL: https://git.example.com/fleet.git
              targetRevision: HEAD
              path: root
              helm:
                valueFiles:
                  - $catalogue/values.yaml
                  - $values/clusters/common.yaml
                  - $values/clusters/this.yaml
            - repoURL: https://git.example.com/catalogue.git
              targetRevision: HEAD
              ref: catalogue
            - repoURL: https://git.example.com/fleet.git
              targetRevision: HEAD
              ref: values

  - it: emits one Application per picked package, from the catalogue repo
    documentSelector:
      path: metadata.name
      value: b
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "10"
      - equal:
          path: spec.sources
          value:
            - repoURL: https://git.example.com/catalogue.git
              targetRevision: HEAD
              path: packages/b
              helm:
                valueFiles:
                  - $catalogue/values.yaml
                  - $values/clusters/common.yaml
                  - $values/clusters/this.yaml
                valuesObject:
                  argocdAppLoader:
                    source:
                      repoURL: https://git.example.com/catalogue.git
                      targetRevision: HEAD
                      path: packages/b
                    takenNames:
                      - a
                      - b
                      - cluster
            - repoURL: https://git.example.com/catalogue.git
              targetRevision: HEAD
              ref: catalogue
            - repoURL: https://git.example.com/fleet.git
              targetRevision: HEAD
              ref: values

  - it: leaves out a package that isn't picked
    set:
      cluster.packages.b: false
    asserts:
      - hasDocuments:
          count: 2

  - it: pins a package and the defaults it reads to its version, quoted
    set:
      cluster.packages.a:
        version: "2026.10"
    documentSelector:
      path: metadata.name
      value: a
    asserts:
      - equal:
          path: spec.sources[0].targetRevision
          value: "2026.10"
      - equal:
          path: spec.sources[0].helm.valuesObject.argocdAppLoader.source.targetRevision
          value: "2026.10"
      - equal:
          path: spec.sources[1].targetRevision
          value: "2026.10"

  - it: counts an empty map as picked
    set:
      cluster.packages.a: {}
    documentSelector:
      path: metadata.name
      value: a
    asserts:
      - equal:
          path: spec.sources[0].targetRevision
          value: HEAD

  - it: takes a package from another repo, mirrored, at its own HEAD
    set:
      argocdAppLoader.packages.ext:
        wave: 20
        repoURL: https://github.com/someone/ext.git
      cluster.packages.ext: true
      cluster.targetRevision: v1
      cluster.mirrors:
        via:
          forgejo:
            enabled: true
            base: http://forgejo.local/mirror-bot
        table:
          github.com/someone/ext:
            via: forgejo
            repo: ext
    documentSelector:
      path: metadata.name
      value: ext
    asserts:
      - equal:
          path: spec.sources[0].repoURL
          value: http://forgejo.local/mirror-bot/ext
      - equal:
          path: spec.sources[0].path
          value: .
      - equal:
          path: spec.sources[0].targetRevision
          value: HEAD
      - equal:
          path: spec.sources[1]
          value:
            repoURL: https://git.example.com/catalogue.git
            targetRevision: v1
            ref: catalogue

  - it: emits the instance's own packages from the instance repo
    set:
      cluster.instancePackages.site:
        path: packages/site
        wave: 40
    documentSelector:
      path: metadata.name
      value: site
    asserts:
      - equal:
          path: spec.sources[0].repoURL
          value: https://git.example.com/fleet.git
      - equal:
          path: spec.sources[0].path
          value: packages/site
      - contains:
          path: spec.sources[0].helm.valuesObject.argocdAppLoader.takenNames
          content: site

  - it: switches both repos to the local git with useLocalGit
    set:
      cluster.useLocalGit: true
    asserts:
      - equal:
          path: spec.sources[0].repoURL
          value: http://forgejo.local/fleet
        documentSelector:
          path: metadata.name
          value: cluster
      - equal:
          path: spec.sources[0].repoURL
          value: http://forgejo.local/catalogue
        documentSelector:
          path: metadata.name
          value: a

  - it: cleans a package path
    set:
      argocdAppLoader.packages.b.path: ./pkgs/b/
    documentSelector:
      path: metadata.name
      value: b
    asserts:
      - equal:
          path: spec.sources[0].path
          value: pkgs/b

  - it: fails on a pick the catalogue doesn't have
    set:
      cluster.packages.c: true
    asserts:
      - failedTemplate:
          errorPattern: "cluster.packages.c: no such package; the catalogue has a, b"

  - it: fails on a pick that is neither a bool nor a map
    set:
      cluster.packages.a: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "cluster.packages.a must be true, false or \\{version: <git ref>\\}, got yes \\(a string\\)"

  - it: fails on a typo inside a pick
    set:
      cluster.packages.a:
        verison: v1
    asserts:
      - failedTemplate:
          errorPattern: "cluster.packages.a.verison: a pick only takes version"

  - it: fails on an unquoted version
    set:
      cluster.packages.a:
        version: 1.10
    asserts:
      - failedTemplate:
          errorPattern: "cluster.packages.a.version must be a string, so quote it \\(got 1.1, which YAML reads as a float64\\)"

  - it: fails when nothing is picked
    set:
      cluster.packages:
        a: false
        b: false
    asserts:
      - failedTemplate:
          errorPattern: "picks no package"

  - it: fails on an empty list of instance values files
    set:
      cluster.instanceValuesFiles: []
    asserts:
      - failedTemplate:
          errorPattern: "cluster.instanceValuesFiles must list at least one file"

  - it: fails on a catalogue package named like the root
    set:
      argocdAppLoader.packages.cluster.wave: 5
    asserts:
      - failedTemplate:
          errorPattern: "the root and a catalogue package would both be Application/cluster"

  - it: fails on an instance package named like the root
    set:
      cluster.instancePackages.cluster:
        path: x
        wave: 1
    asserts:
      - failedTemplate:
          errorPattern: "the root and an instance package would both be Application/cluster"

  - it: fails without rootPath
    set:
      argocdAppLoader.rootPath: null
    asserts:
      - failedTemplate:
          errorPattern: "argocdAppLoader.rootPath is required"

  - it: fails on an instance package named like a catalogue package
    set:
      cluster.instancePackages.a:
        path: x
        wave: 1
    asserts:
      - failedTemplate:
          errorPattern: "a catalogue package and an instance package would both be Application/a"

  - it: names the key it is missing, local or remote
    set:
      cluster.useLocalGit: true
      cluster.localGitRepo: null
    asserts:
      - failedTemplate:
          errorPattern: "cluster.localGitRepo is required"
