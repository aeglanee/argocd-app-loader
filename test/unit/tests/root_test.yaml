suite: root
templates:
  - root.yaml
release:
  name: cluster
set:
  rootTest: true
  cluster:
    remoteGitRepo: https://git.example.com/catalogue.git
    localGitRepo: http://forgejo.local/catalogue
    instanceRemoteRepo: https://git.example.com/fleet.git
    instanceLocalRepo: http://forgejo.local/fleet
    instanceValuesFiles:
      - clusters/common.yaml
      - clusters/this.yaml
    packages:
      a:
        wave: 0
        apps:
          y: true
        enabled: true
      b:
        wave: 10
        apps:
          x: true
        enabled: true
  argocdAppLoader:
    rootPath: root
tests:
  - it: emits itself from the instance repo, reading the catalogue's values and then the cluster's
    documentSelector:
      path: metadata.name
      value: cluster
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false
      - equal:
          path: spec.sources
          value:
            - repoURL: https://git.example.com/fleet.git
              targetRevision: HEAD
              path: root
              helm:
                valueFiles:
                  - $catalogue/values.yaml
                  - $values/clusters/common.yaml
                  - $values/clusters/this.yaml
            - repoURL: https://git.example.com/catalogue.git
              targetRevision: HEAD
              ref: catalogue
            - repoURL: https://git.example.com/fleet.git
              targetRevision: HEAD
              ref: values

  - it: emits one Application per picked package, from the catalogue repo
    documentSelector:
      path: metadata.name
      value: pkg-b
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "10"
      - equal:
          path: spec.sources
          value:
            - repoURL: https://git.example.com/catalogue.git
              targetRevision: HEAD
              path: packages/b
              helm:
                valueFiles:
                  - $catalogue/values.yaml
                  - $values/clusters/common.yaml
                  - $values/clusters/this.yaml
                valuesObject:
                  argocdAppLoader:
                    source:
                      repoURL: https://git.example.com/catalogue.git
                      targetRevision: HEAD
                      path: packages/b
                    package: b
                    rootName: cluster
            - repoURL: https://git.example.com/catalogue.git
              targetRevision: HEAD
              ref: catalogue
            - repoURL: https://git.example.com/fleet.git
              targetRevision: HEAD
              ref: values

  - it: leaves out a package that isn't picked
    set:
      cluster.packages.b.enabled: false
    asserts:
      - hasDocuments:
          count: 2

  - it: pins a package and the defaults it reads to its version, quoted
    set:
      cluster.packages.a.version: "2026.10"
    documentSelector:
      path: metadata.name
      value: pkg-a
    asserts:
      - equal:
          path: spec.sources[0].targetRevision
          value: "2026.10"
      - equal:
          path: spec.sources[0].helm.valuesObject.argocdAppLoader.source.targetRevision
          value: "2026.10"
      - equal:
          path: spec.sources[1].targetRevision
          value: "2026.10"

  - it: fails on a pick without enabled
    set:
      cluster.packages.c: {}
      cluster.packages.c.wave: 30
    asserts:
      - failedTemplate:
          errorPattern: "cluster.packages.c.enabled must be true or false, got <nil>"

  - it: takes a package from another repo, mirrored, at its own HEAD
    set:
      cluster.packages.ext:
        wave: 20
        repoURL: https://github.com/someone/ext.git
        apps: {}
      cluster.packages.ext.enabled: true
      cluster.targetRevision: v1
      cluster.mirrors:
        via:
          forgejo:
            enabled: true
            base: http://forgejo.local/mirror-bot
        table:
          github.com/someone/ext:
            via: forgejo
            repo: ext
    documentSelector:
      path: metadata.name
      value: pkg-ext
    asserts:
      - equal:
          path: spec.sources[0].repoURL
          value: http://forgejo.local/mirror-bot/ext
      - equal:
          path: spec.sources[0].path
          value: .
      - equal:
          path: spec.sources[0].targetRevision
          value: HEAD
      - equal:
          path: spec.sources[1]
          value:
            repoURL: https://git.example.com/catalogue.git
            targetRevision: v1
            ref: catalogue

  - it: emits the instance's own packages from the instance repo
    set:
      cluster.instancePackages.site:
        path: packages/site
        wave: 40
        apps:
          blog: true
    documentSelector:
      path: metadata.name
      value: pkg-site
    asserts:
      - equal:
          path: spec.sources[0].repoURL
          value: https://git.example.com/fleet.git
      - equal:
          path: spec.sources[0].path
          value: packages/site
      - equal:
          path: spec.sources[0].helm.valuesObject.argocdAppLoader.package
          value: site

  - it: switches both repos to the local git with useLocalGit
    set:
      cluster.useLocalGit: true
    asserts:
      - equal:
          path: spec.sources[0].repoURL
          value: http://forgejo.local/fleet
        documentSelector:
          path: metadata.name
          value: cluster
      - equal:
          path: spec.sources[0].repoURL
          value: http://forgejo.local/catalogue
        documentSelector:
          path: metadata.name
          value: pkg-a

  - it: cleans a package path
    set:
      cluster.packages.b.path: ./pkgs/b/
    documentSelector:
      path: metadata.name
      value: pkg-b
    asserts:
      - equal:
          path: spec.sources[0].path
          value: pkgs/b

  - it: fails on a package the catalogue doesn't define, naming the ones it does
    set:
      cluster.packages.c.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "cluster.packages.c isn't a package the catalogue defines \\(no wave, no apps\\); a typo\\? The packages: a, b"

  - it: fails on a pick that isn't a map, even a bare true, which would replace a lower file's map
    set:
      cluster.packages.a: true
    asserts:
      - failedTemplate:
          errorPattern: "cluster.packages.a must be a map, \\{enabled: true\\} or \\{enabled: false\\}, got true \\(a bool\\)"

  - it: fails on a typo inside a pick
    set:
      cluster.packages.a.verison: v1
    asserts:
      - failedTemplate:
          errorPattern: "cluster.packages.a.verison: a package takes enabled, version, apps, overrides, wave, repoURL, path, mirror"

  - it: fails on an unquoted version
    set:
      cluster.packages.a.version: 1.10
    asserts:
      - failedTemplate:
          errorPattern: "cluster.packages.a.version must be a string, so quote it \\(got 1.1, which YAML reads as a float64\\)"

  - it: fails when nothing is picked
    set:
      cluster.packages:
        a:
          enabled: false
        b:
          enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "picks no package"

  - it: fails on an empty list of instance values files
    set:
      cluster.instanceValuesFiles: []
    asserts:
      - failedTemplate:
          errorPattern: "cluster.instanceValuesFiles must list at least one file"

  - it: fails when the root is named like a package Application
    release:
      name: pkg-root
    asserts:
      - failedTemplate:
          errorPattern: "the root is named pkg-root, but pkg-\\* names are the packages'"

  - it: fails without rootPath
    set:
      argocdAppLoader.rootPath: null
    asserts:
      - failedTemplate:
          errorPattern: "argocdAppLoader.rootPath is required"

  - it: fails on an instance package named like a catalogue package
    set:
      cluster.instancePackages.a:
        path: x
        wave: 1
        apps: {}
    asserts:
      - failedTemplate:
          errorPattern: "a catalogue package and an instance package would both be Application/pkg-a"

  - it: names the key it is missing, local or remote
    set:
      cluster.useLocalGit: true
      cluster.localGitRepo: null
    asserts:
      - failedTemplate:
          errorPattern: "cluster.localGitRepo is required"

  - it: refuses to switch a package off while an app that is on in another needs one of its apps
    set:
      argocdAppLoader.dependencies:
        x:
          requires:
            - y
      cluster.packages.a.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "x requires y, but nothing that is on provides it \\(off: y \\(package a isn't picked\\)\\)"

  - it: checks dependencies without needing the packages' files
    set:
      argocdAppLoader.dependencies:
        x:
          requires:
            - y
    asserts:
      - notFailedTemplate: {}

  - it: fails on a dependency entry no package lists
    set:
      argocdAppLoader.dependencies:
        z:
          requires: []
    asserts:
      - failedTemplate:
          errorPattern: "dependencies.z: no package lists app z"

  - it: checks every package's app list, so a misplaced toggle fails before any package syncs
    set:
      cluster.packages.a.apps.x: false
    asserts:
      - failedTemplate:
          errorPattern: "app x is listed under two packages, a and b"

  - it: fails on a package without its apps, which would switch every app off
    set:
      cluster.packages.b.apps: null
    asserts:
      - failedTemplate:
          errorPattern: "cluster.packages.b.apps is required"

  - it: fails on a misspelt key of an instance package
    set:
      cluster.instancePackages.site:
        path: packages/site
        wave: 40
        apps: {}
        overides: {}
    asserts:
      - failedTemplate:
          errorPattern: "cluster.instancePackages.site.overides: an instance package takes path, wave, version, apps, overrides"

  - it: names an instance package's own key in its toggle errors, and lets a later file drop a toggle with null
    set:
      cluster.instancePackages.site:
        path: packages/site
        wave: 40
        apps:
          blog: true
          gone: null
        overrides:
          x:
            replicas: 0
    asserts:
      - failedTemplate:
          errorPattern: "cluster.instancePackages.site.overrides.x: x is in package b"

  - it: fails on the old package list, which moved into cluster.packages
    set:
      argocdAppLoader.packages:
        a:
          wave: 0
    asserts:
      - failedTemplate:
          errorPattern: "argocdAppLoader.packages moved to cluster.packages"

  - it: fails on flat toggles, which would do nothing with packages
    set:
      cluster.apps:
        x: true
    asserts:
      - failedTemplate:
          errorPattern: "cluster.apps: with packages, set cluster.packages.<package>.apps"
