suite: check
templates:
  - check.yaml
set:
  cluster.apps:
    base: true
    needs-base: true
    user: true
    eager: true
    other: true
    typo: true
    bad: true
tests:
  - it: passes when every requirement is on and comes no later
    set:
      check.roots:
        - name: a
          path: roots/a/apps
          wave: 0
          on: true
        - name: b
          path: roots/b/apps
          wave: 10
          on: true
    asserts:
      - hasDocuments:
          count: 0

  - it: names every dependent of an app that is off
    set:
      cluster.apps.needs-base: false
      check.roots:
        - name: a
          path: roots/a/apps
          wave: 0
          on: true
        - name: b
          path: roots/b/apps
          wave: 10
          on: true
    asserts:
      - failedTemplate:
          errorPattern: "argocd-app-loader: needs-base is off, but user requires it — switch it off first, or switch needs-base on"

  - it: treats every app of a root that is off as off
    set:
      check.roots:
        - name: a
          path: roots/a/apps
          wave: 0
          on: false
        - name: b
          path: roots/b/apps
          wave: 10
          on: true
    asserts:
      - failedTemplate:
          errorPattern: "everything providing csi \\(base\\) is off because a is off, but user requires it — switch it off first, or switch base or a on"

  - it: fails on a requirement nothing is named or provides
    set:
      check.roots:
        - name: typo
          path: roots/typo/apps
          wave: 0
          on: true
    asserts:
      - failedTemplate:
          errorPattern: "typo requires nothing-like-this, but no app is named so or provides it"

  - it: fails when a required app comes later
    set:
      check.roots:
        - name: a
          path: roots/a/apps
          wave: 0
          on: true
        - name: b
          path: roots/b/apps
          wave: 10
          on: true
        - name: early
          path: roots/early/apps
          wave: -5
          on: true
    asserts:
      - failedTemplate:
          errorPattern: "eager \\(early, wave 0\\) requires user \\(b, wave 0\\), which comes later"

  - it: compares app waves inside one root
    set:
      check.roots:
        - name: a
          path: roots/a/apps
          wave: 0
          on: true
        - name: b
          path: roots/b/apps
          wave: 0
          on: true
    asserts:
      - failedTemplate:
          errorPattern: "user \\(b, wave 0\\) requires needs-base \\(a, wave 1\\), which comes later"

  - it: fails on an app name used in two roots
    set:
      check.roots:
        - name: a
          path: roots/a/apps
          wave: 0
          on: true
        - name: dup
          path: roots/dup/apps
          wave: 0
          on: true
    asserts:
      - failedTemplate:
          errorPattern: "duplicate app name \"base\" in roots/a/apps/ga/base and roots/dup/apps/gd/base"

  - it: fails on a group used in two roots
    set:
      check.roots:
        - name: a
          path: roots/a/apps
          wave: 0
          on: true
        - name: dupgroup
          path: roots/dupgroup/apps
          wave: 0
          on: true
    asserts:
      - failedTemplate:
          errorPattern: "group \"ga\" is in both roots/a/apps and roots/dupgroup/apps"

  - it: fails on requires that isn't a list
    set:
      check.roots:
        - name: badtype
          path: roots/badtype/apps
          wave: 0
          on: true
    asserts:
      - failedTemplate:
          errorPattern: "roots/badtype/apps/gx/bad/app.yaml: requires must be a list, got string"

  - it: counts a root without on as on
    set:
      check.roots:
        - name: a
          path: roots/a/apps
        - name: b
          path: roots/b/apps
          wave: 10
    asserts:
      - hasDocuments:
          count: 0
