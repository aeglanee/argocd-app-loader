suite: loader
templates:
  - render.yaml
tests:
  - it: renders an enabled app as an Application
    set:
      cluster.apps.plain: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Application
      - equal:
          path: metadata.name
          value: plain

  - it: skips an app without a toggle
    asserts:
      - hasDocuments:
          count: 0

  # Files that don't parse fail the render with the file's name.
  - it: fails on values that are not valid YAML after templating
    set:
      cluster.apps.invalid-values: true
    asserts:
      - failedTemplate:
          errorPattern: "argocd-app-loader: apps/unit/invalid-values/values.yaml.gotmpl is not a valid YAML mapping after templating: "

  - it: fails on a plain values.yaml that is not valid YAML, naming that file
    set:
      cluster.apps.invalid-plain-values: true
    asserts:
      - failedTemplate:
          errorPattern: "argocd-app-loader: apps/unit/invalid-plain-values/values.yaml is not a valid YAML mapping after templating: "

  - it: fails on an app.yaml that is not valid YAML
    set:
      cluster.apps.invalid-app-yaml: true
    asserts:
      - failedTemplate:
          errorPattern: "argocd-app-loader: apps/unit/invalid-app-yaml/app.yaml is not a valid YAML mapping: "

  # The group tests point appsRoot at a root of their own: every _group.yaml under the root
  # becomes an AppProject, whether or not one of its apps is on.
  - it: fails on a _group.yaml that is not valid YAML
    set:
      argocdAppLoader.appsRoot: invalid-groups
    asserts:
      - failedTemplate:
          errorPattern: "argocd-app-loader: invalid-groups/broken/_group.yaml is not a valid YAML mapping: "

  # syncOptions
  - it: leaves out syncOptions when there are none
    set:
      cluster.apps.plain: true
    asserts:
      - notExists:
          path: spec.syncPolicy.syncOptions

  - it: puts CreateNamespace=true ahead of the app's own syncOptions
    set:
      cluster.apps.sync-options: true
    asserts:
      - equal:
          path: spec.syncPolicy.syncOptions
          value:
            - CreateNamespace=true
            - ServerSideApply=true

  # An explicit empty value is kept; only a missing (or null) field gets the default.
  - it: gives an app the resources finalizer by default, also for a null field
    set:
      cluster.apps.null-finalizers: true
    asserts:
      - equal:
          path: metadata.finalizers
          value:
            - resources-finalizer.argocd.argoproj.io

  - it: honours an explicit empty finalizer list
    set:
      cluster.apps.no-finalizers: true
    asserts:
      - notExists:
          path: metadata.finalizers

  - it: renders a wrong-typed finalizers value as written instead of the default
    set:
      cluster.apps.finalizers-string: true
    asserts:
      - equal:
          path: metadata.finalizers
          value: resources-finalizer.argocd.argoproj.io/background

  - it: keeps revisionHistoryLimit 0
    set:
      cluster.apps.history-zero: true
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 0

  - it: keeps an explicit empty syncPolicy (sync by hand)
    set:
      cluster.apps.manual-sync: true
    asserts:
      - equal:
          path: spec.syncPolicy
          value: {}

  - it: keeps an explicit empty AppProject list instead of allowing everything
    set:
      argocdAppLoader.appsRoot: groups
    asserts:
      - isKind:
          of: AppProject
      - equal:
          path: spec.sourceRepos
          value: []
      - equal:
          path: spec.clusterResourceWhitelist
          value: []
      - equal:
          path: spec.destinations
          value:
            - namespace: "*"
              server: "*"
      - equal:
          path: spec.namespaceResourceWhitelist
          value: []
      - equal:
          path: spec.orphanedResources
          value: {}

  - it: renders a wrong-typed AppProject list as written instead of allowing everything
    set:
      argocdAppLoader.appsRoot: groups-typo
    asserts:
      - equal:
          path: spec.sourceRepos
          value: https://git.example.com/only-this.git
