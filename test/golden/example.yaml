# Source: cluster/templates/render.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "demo"
  destination:
    server: https://kubernetes.default.svc
    namespace: hello
  source:
    repoURL: "git@github.com:example/cluster.git"
    targetRevision: "HEAD"
    path: examples/consumer/apps/demo/hello
    helm:
      releaseName: hello
      valuesObject:
        message: hello, example.com
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - CreateNamespace=true

