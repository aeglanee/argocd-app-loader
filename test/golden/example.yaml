# Source: cluster/templates/render.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wrapped
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "demo"
  destination:
    server: https://kubernetes.default.svc
    namespace: wrapped
  sources:
    - repoURL: "ghcr.io/stefanprodan/charts"
      chart: "podinfo"
      targetRevision: "6.7.0"
      helm:
        releaseName: wrapped
        valuesObject:
          replicaCount: 2
          ui:
            message: from example.com
    - repoURL: "git@github.com:example/cluster.git"
      targetRevision: HEAD
      path: examples/consumer/apps/demo/wrapped
      helm:
        releaseName: wrapped
        valuesObject:
          cluster:
            apps:
              gitchart: true
              hello: true
              httpchart: true
              wraponly: true
              wrapped: true
            argocdNamespace: argocd
            clusterServer: https://kubernetes.default.svc
            domain: example.com
            localGitRepo: git@gitea.{{ .Values.cluster.domain }}:example/cluster.git
            mirrors:
              table:
                ghcr.io:
                  project: ghcr-proxy
                  via: harbor
                github.com/rustfs/operator:
                  repo: rustfs-operator
                  via: forgejo
                stefanprodan.github.io/podinfo:
                  via: shim
              via:
                forgejo:
                  base: http://gitea.{{ .Values.cluster.domain }}/example
                  enabled: false
                harbor:
                  enabled: false
                  host: harbor.{{ .Values.cluster.domain }}
                shim:
                  enabled: false
                  project: shim-proxy
            remoteGitRepo: git@github.com:example/cluster.git
            repoBasePath: examples/consumer
            targetRevision: HEAD
            useLocalGit: false
          localGreeting: hi-from-example.com
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - CreateNamespace=true
