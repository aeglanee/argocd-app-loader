# Source: cluster/templates/render.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: "Demo group for the argocd-app-loader example consumer."
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
# Source: cluster/templates/render.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitchart
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "demo"
  destination:
    server: https://kubernetes.default.svc
    namespace: gittest
  sources:
    - repoURL: "https://github.com/rustfs/operator"
      path: "deploy/rustfs-operator"
      targetRevision: "0.0.2"
      helm:
        releaseName: gitchart
        valuesObject:
          {}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - CreateNamespace=true

