# Source: cluster/templates/render.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wrapped
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "demo"
  destination:
    server: https://kubernetes.default.svc
    namespace: wrapped
  sources:
    - repoURL: "ghcr.io/stefanprodan/charts"
      chart: "podinfo"
      targetRevision: "6.7.0"
      helm:
        releaseName: wrapped
        valuesObject:
          replicaCount: 2
          ui:
            message: from example.com
    - repoURL: "git@github.com:example/cluster.git"
      targetRevision: "HEAD"
      path: examples/consumer/apps/demo/wrapped
      helm:
        releaseName: wrapped
        valuesObject:
          cluster:
            argocdNamespace: argocd
            domain: example.com
          localGreeting: hi-from-example.com
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - CreateNamespace=true
