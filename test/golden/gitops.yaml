apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radar
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "administration"
  destination:
    server: https://kubernetes.default.svc
    namespace: radar
  sources:
    - repoURL: "https://skyhook-io.github.io/helm-charts"
      chart: "radar"
      targetRevision: "1.18.2"
      helm:
        releaseName: radar
        valuesObject:
          argocd:
            existingSecret: radar-argocd
            existingSecretKey: token
          auth:
            cookieTTL: 12h
            existingSecret: radar-session
            existingSecretKey: auth-secret
            mode: oidc
            oidc:
              clientID: radar
              clientSecretKey: client-secret
              enablePKCE: true
              existingSecret: radar-oidc
              groupsClaim: groups
              groupsPrefix: ""
              issuerURL: https://authentik.irkalla.eu/application/o/radar/
              postLogoutRedirectURL: https://radar.irkalla.eu/
              redirectURL: https://radar.irkalla.eu/auth/callback
              scopes:
              - openid
              - profile
              - groups
              usernameClaim: sub
              usernamePrefix: 'oidc:'
          debug:
            image: docker.io/library/busybox:1.38.0
          fullnameOverride: radar
          httpRoute:
            enabled: false
          ingress:
            enabled: false
          mcp:
            enabled: true
          persistence:
            enabled: false
          podSecurityContext:
            fsGroup: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          rbac:
            additionalCrdGroups:
            - longhorn.io
            - operator.victoriametrics.com
            - redis.redis.opstreelabs.in
            - deuxfleurs.fr
            helm: false
            metrics: true
            podExec: true
            podLogs: true
            portForward: false
            traffic: true
            viewRBAC: true
            viewWebhooks: true
          timeline:
            postgres:
              existingSecret: radar-postgres-app
              secretKey: uri
            retention: 168h
            storage: postgres
          traffic:
            prometheusUrl: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8428
    - repoURL: "https://github.com/aeglanee/gitops.git"
      targetRevision: "HEAD"
      path: apps/administration/radar
      helm:
        releaseName: radar
        valuesObject:
          {}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - ServerSideApply=true

