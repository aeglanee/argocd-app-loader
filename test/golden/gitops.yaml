            - Status:
              - ArgoCD:
                  href: https://argocd.irkalla.eu
                  icon: argo-cd.png
                  id: statuscard
                  widget:
                    key: '{{HOMEPAGE_VAR_ARGOCD_TOKEN}}'
                    type: argocd
                    url: http://argocd-server.argocd.svc
            - Media:
              - YouTube:
                  description: Videos
                  href: https://youtube.com/
                  icon: youtube.png
              - Reddit:
                  description: Communities
                  href: https://reddit.com/
                  icon: reddit.png
            - Mail:
              - Gmail:
                  description: Email
                  href: https://mail.google.com/
                  icon: gmail.png
              - ProtonMail:
                  description: Encrypted email
                  href: https://mail.proton.me/
                  icon: proton-mail.png
            - Finance:
              - Investing.com:
                  description: Markets & news
                  href: https://www.investing.com/
                  icon: mdi-chart-line
              - Google Finance:
                  description: Markets
                  href: https://www.google.com/finance/
                  icon: google.png
            - AI & Tools:
              - Claude:
                  description: AI assistant
                  href: https://claude.ai/
                  icon: claude-ai.png
            settingsString: |
              title: irkalla
              theme: dark
              color: slate
              headerStyle: clean
              hideVersion: true
              background:
                image: https://images.unsplash.com/photo-1451187580459-43490279c0fa
                blur: sm
                saturate: 60
                brightness: 40
                opacity: 50
              cardBlur: sm
              # The longhorn info widget reads its endpoint from here (a PROVIDER), not from the widget
              # block (homepage's longhorn handler looks up settings.providers.longhorn.url).
              providers:
                longhorn:
                  url: http://longhorn-frontend.longhorn-system.svc
              # Local/cluster groups first, then web/bookmark groups (separated). Order honoured.
              layout:
                - Nodes:
                    columns: 3
                - Status: {}
                - Infrastructure:
                    style: row
                    columns: 4
                - Platform:
                    style: row
                    columns: 4
                - Administration:
                    style: row
                    columns: 4
                # Local cluster apps (discovered from HTTPRoute gethomepage.dev/group: "Apps",
                # e.g. Ghostfolio). Placed AFTER the local-service groups and BEFORE the external
                # link groups so it joins the top cluster block — Media/Mail/Finance flow down a row.
                - Apps:
                    style: row
                    columns: 4
                - Media:
                    style: row
                    columns: 4
                - Mail:
                    style: row
                    columns: 4
                - Finance:
                    style: row
                    columns: 4
                - "AI & Tools":
                    style: row
                    columns: 4
            widgets:
            - longhorn:
                expanded: true
                labels: true
                nodes: true
                total: true
            - search:
                provider: duckduckgo
                target: _blank
            - openmeteo:
                cache: 5
                label: Tallinn
                latitude: 59.437
                longitude: 24.754
                units: metric
          enableRbac: true
          env:
            HOMEPAGE_ALLOWED_HOSTS: homepage.irkalla.eu
            HOMEPAGE_VAR_ARGOCD_TOKEN:
              valueFrom:
                secretKeyRef:
                  key: token
                  name: homepage-argocd
                  optional: true
          ingress:
            main:
              enabled: false
          persistence:
            custom-css:
              enabled: true
              mountPath: /app/config/custom.css
              name: homepage-custom-css
              readOnly: true
              subPath: custom.css
              type: configMap
          resources:
            requests:
              memory: 160Mi
