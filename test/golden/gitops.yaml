# Source: cluster/templates/render.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "administration"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: "ghcr.io/argoproj/argo-helm"
      chart: "argo-cd"
      targetRevision: "10.11.6"
      helm:
        releaseName: argocd
        valuesObject:
          applicationSet:
            resources:
              requests:
                memory: 64Mi
          configs:
            cm:
              accounts.homepage: apiKey
              accounts.radar: apiKey
              create: true
              oidc.config: |
                name: Authentik
                issuer: https://authentik.irkalla.eu/application/o/argocd/
                clientID: argocd
                clientSecret: $argocd-oidc-secret:clientSecret
                requestedScopes: ["openid", "profile", "groups"]
                requestedIDTokenClaims:
                  groups:
                    essential: true
              resource.customizations.ignoreDifferences.apps_StatefulSet: |
                jqPathExpressions:
                  - .spec.volumeClaimTemplates[].apiVersion
                  - .spec.volumeClaimTemplates[].kind
                  - .spec.volumeClaimTemplates[].status
              resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
                jqPathExpressions:
                  - .spec.data[].remoteRef.conversionStrategy
                  - .spec.data[].remoteRef.decodingStrategy
                  - .spec.data[].remoteRef.metadataPolicy
                  - .spec.data[].remoteRef.nullBytePolicy
            params:
              server.insecure: "true"
            rbac:
              create: true
              policy.csv: |
                g, infrastructure-admins, role:admin
                g, argocd-admin, role:admin
                g, argocd-viewer, role:readonly
                g, homepage, role:readonly
                g, radar, role:readonly
              policy.default: ""
              scopes: '[groups]'
          controller:
            resources:
              requests:
                memory: 640Mi
          dex:
            resources:
              requests:
                memory: 32Mi
          global:
            domain: argocd.irkalla.eu
            priorityClassName: platform-critical
          notifications:
            resources:
              requests:
                memory: 64Mi
          redis:
            resources:
              requests:
                memory: 32Mi
          repoServer:
            resources:
              requests:
                memory: 128Mi
          server:
            resources:
              requests:
                memory: 64Mi
            service:
              type: ClusterIP
    - repoURL: "https://github.com/aeglanee/gitops.git"
      targetRevision: "HEAD"
      path: apps/administration/argocd
      helm:
        releaseName: argocd
        valuesObject:
          {}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - ServerSideApply=true

