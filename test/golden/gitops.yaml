apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "administration"
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  sources:
    - repoURL: "ghcr.io/goauthentik/helm-charts"
      chart: "authentik"
      targetRevision: "2026.8.5"
      helm:
        releaseName: authentik
        valuesObject:
          authentik:
            postgresql:
              host: authentik-postgres-rw.authentik.svc.cluster.local
              name: authentik
              user: authentik
          blueprints:
            configMaps:
            - authentik-blueprints
          global:
            env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secret_key
                  name: authentik-core-secret
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: bootstrap_password
                  name: authentik-core-secret
            - name: AUTHENTIK_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  key: bootstrap_token
                  name: authentik-core-secret
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: authentik-postgres-app
            - name: AUTHENTIK_REDIS__HOST
              value: authentik-redis-master.authentik.svc.cluster.local
            - name: AUTHENTIK_REDIS__PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: authentik-redis-secret
            - name: DOMAIN
              value: irkalla.eu
          postgresql:
            enabled: false
          redis:
            enabled: false
          server:
            resources:
              requests:
                memory: 704Mi
          worker:
            resources:
              requests:
                memory: 320Mi
            volumeMounts:
            - mountPath: /oidc
              name: oidc-clients
              readOnly: true
            volumes:
            - name: oidc-clients
              secret:
                secretName: authentik-oidc-clients
    - repoURL: "https://github.com/aeglanee/gitops.git"
      targetRevision: "HEAD"
      path: apps/administration/authentik
      helm:
        releaseName: authentik
        valuesObject:
          oidcClients:
            argocd:
              app: argocd
              groups:
              - argocd-admin
              - argocd-viewer
              name: ArgoCD
              redirect: https://argocd.irkalla.eu/auth/callback
            forgejo:
              app: forgejo
              groups:
              - forgejo-admin
              - forgejo-user
              name: Forgejo
              redirect: https://forgejo.irkalla.eu/user/oauth2/authentik/callback
            grafana:
              app: grafana
              groups:
              - grafana-admin
              - grafana-viewer
              name: Grafana
              redirect: https://grafana.irkalla.eu/login/generic_oauth
            harbor:
              app: harbor
              groups:
              - harbor-admin
              name: Harbor
              redirect: https://harbor.irkalla.eu/c/oidc/callback
            headlamp:
              name: Headlamp
              redirect: https://headlamp.irkalla.eu/oidc-callback
            radar:
              app: radar
              groups:
              - k8s-admin
              - k8s-viewer
              name: Radar
              redirect: https://radar.irkalla.eu/auth/callback
          proxyApps:
            hubble:
              app: cilium
              externalHost: https://hubble.irkalla.eu
              groups:
              - hubble-viewer
              internalHost: http://hubble-ui.kube-system.svc
              name: Hubble
            longhorn:
              app: longhorn
              externalHost: https://longhorn.irkalla.eu
              groups:
              - longhorn-admin
              internalHost: http://longhorn-frontend.longhorn-system.svc
              name: Longhorn
            victoria-logs:
              app: victoria-logs
              externalHost: https://logs.irkalla.eu
              groups:
              - logs-viewer
              internalHost: http://victoria-logs-server.monitoring.svc:9428
              name: VictoriaLogs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true

