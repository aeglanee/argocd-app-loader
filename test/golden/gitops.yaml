# Source: cluster/templates/render.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "administration"
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  sources:
    - repoURL: "code.forgejo.org/forgejo-helm"
      chart: "forgejo"
      targetRevision: "17.3.2"
      helm:
        releaseName: forgejo
        valuesObject:
          gitea:
            additionalConfigFromEnvs:
            - name: GITEA__DATABASE__PASSWD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: forgejo-postgres-app
            admin:
              existingSecret: forgejo-admin-secret
            config:
              actions:
                ENABLED: true
              cache:
                ADAPTER: memory
              database:
                DB_TYPE: postgres
                HOST: forgejo-postgres-rw.forgejo.svc.cluster.local:5432
                NAME: forgejo
                USER: forgejo
              oauth2_client:
                ACCOUNT_LINKING: auto
                ENABLE_AUTO_REGISTRATION: true
                USERNAME: preferred_username
              server:
                DOMAIN: forgejo.irkalla.eu
                ROOT_URL: https://forgejo.irkalla.eu
                SSH_DOMAIN: forgejo.irkalla.eu
                SSH_PORT: 22
              service:
                ALLOW_ONLY_EXTERNAL_REGISTRATION: false
                ENABLE_NOTIFY_MAIL: false
                REGISTER_EMAIL_CONFIRM: false
                SHOW_REGISTRATION_BUTTON: false
            oauth:
            - adminGroup: forgejo-admin
              autoDiscoverUrl: https://authentik.irkalla.eu/application/o/forgejo/.well-known/openid-configuration
              existingSecret: forgejo-oidc-secret
              groupClaimName: groups
              name: authentik
              provider: openidConnect
              scopes: openid,profile,email,groups
          ingress:
            enabled: false
          priorityClassName: platform-critical
          resources:
            requests:
              memory: 320Mi
          service:
            ssh:
              annotations:
                io.cilium/lb-ipam-ips: 192.168.1.10
                io.cilium/lb-ipam-sharing-cross-namespace: '*'
                io.cilium/lb-ipam-sharing-key: forgejo-ssh
              port: 22
              type: LoadBalancer
          strategy:
            type: Recreate
    - repoURL: "https://github.com/aeglanee/gitops.git"
      targetRevision: "HEAD"
      path: apps/administration/forgejo
      helm:
        releaseName: forgejo
        valuesObject:
          {}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - CreateNamespace=true

