apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-runner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "administration"
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo-runner
  sources:
    - repoURL: "git.erwanleboucher.dev/eleboucher/charts"
      chart: "forgejo-runner"
      targetRevision: "13.2.1"
      helm:
        releaseName: forgejo-runner
        valuesObject:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - server-b
          deploymentAnnotations: {}
          forgejo:
            existingSecret: forgejo-runner-secret
            url: http://forgejo-http.forgejo.svc:3000
          podSpecs:
            podspec-default.yaml: |
              serviceAccountName: forgejo-ci-jobs
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: NotIn
                            values: ["server-b"]
              containers:
                - name: main
                  image: node:24-bookworm
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      memory: 1Gi
              restartPolicy: Never
            podspec-rust.yaml: |
              serviceAccountName: forgejo-ci-jobs
              priorityClassName: batch-low
              nodeSelector:
                kubernetes.io/hostname: server-c
              containers:
                - name: main
                  image: rust:1.99.1-bookworm
                  resources:
                    requests:
                      cpu: "2"
                      memory: 1Gi
                    limits:
                      memory: 2Gi
                  volumeMounts:
                    - name: cache
                      mountPath: /cache
              volumes:
                - name: cache
                  persistentVolumeClaim:
                    claimName: rust-ci-cache
              restartPolicy: Never
          runnerConfig: |
            log:
              level: info
            cache:
              enabled: false
            container:
              docker_host: "-"
              workdir_parent: shared/workdir
            host:
              workdir_parent: /data/act
            plugins:
              k8s:
                address: "unix:///plugin/forgejo-runner-k8s.sock"
                options:
                  namespace: forgejo-runner
                  poll_timeout: 10m
                  labels: "app.kubernetes.io/name=forgejo-ci-job"
                  resources: |
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
            runner:
              capacity: 2
              timeout: 3h                                # rts_engine nightly mutants shard: timeout-minutes 150
              shutdown_timeout: 3m
              labels:
                - k8s:k8s:///config/podspec-default.yaml
                - k8s-rust:k8s:///config/podspec-rust.yaml
    - repoURL: "https://github.com/aeglanee/gitops.git"
      targetRevision: "HEAD"
      path: apps/administration/forgejo-runner
      helm:
        releaseName: forgejo-runner
        valuesObject:
          {}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true

