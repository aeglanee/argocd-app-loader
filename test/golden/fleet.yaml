# Source: root/templates/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: "https://github.com/example/catalogue.git"
      targetRevision: "HEAD"
      path: "packages/core"
      helm:
        valueFiles:
          - $catalogue/values.yaml
          - $values/clusters/demo/values.yaml
        valuesObject:
          argocdAppLoader:
            source:                     # where this package's files are
              repoURL: "https://github.com/example/catalogue.git"
              targetRevision: "HEAD"
              path: "packages/core"
            takenNames:                 # the root's and the packages': no app may take one
              - cluster
              - core
              - media
              - site
    - repoURL: "https://github.com/example/catalogue.git"
      targetRevision: "HEAD"
      ref: catalogue
    - repoURL: "https://github.com/example/fleet.git"
      targetRevision: "HEAD"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # As for apps: a failed sync isn't retried for the same commit otherwise.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true

