# Source: root/templates/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: "https://github.com/example/fleet.git"
      targetRevision: "HEAD"
      path: "root"
      helm:
        valueFiles:
          - $catalogue/values.yaml
          - $values/clusters/demo/values.yaml
    - repoURL: "https://github.com/example/catalogue.git"
      targetRevision: "HEAD"
      ref: catalogue
    - repoURL: "https://github.com/example/fleet.git"
      targetRevision: "HEAD"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

